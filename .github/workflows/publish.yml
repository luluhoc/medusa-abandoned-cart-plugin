name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag to publish under"
        required: false
        default: latest

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --network-timeout 300000

      # The release tag must match the version in package.json, otherwise the
      # GitHub release and the published package drift apart.
      - name: Verify version matches release tag
        if: github.event_name == 'release'
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "package.json version ($pkg_version) does not match release tag ($tag_version)" >&2
            exit 1
          fi

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      # --ignore-scripts skips prepublishOnly, which would rebuild what the
      # step above already produced in .medusa/server.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts --tag "${{ inputs.tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
